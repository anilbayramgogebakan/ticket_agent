name: CI

# Every pull request, and every push to main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Same version as the Dockerfile and the local conda env. Dev/CI/prod
          # drift is its own bug source, and config.py needs tomllib (3.11+).
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        # No API key, no network, no cost: every test injects MockLLMClient.
        #
        # Integration tests against a real provider are deliberately NOT here.
        # In one afternoon of building this, Hugging Face exhausted its quota,
        # Gemini returned 503s for twenty minutes, and a pinned model was
        # retired with a 404. A CI job that calls a real provider goes red for
        # reasons that have nothing to do with the change under review, and a
        # gate that cries wolf is a gate people learn to ignore. Real-provider
        # checks belong on a schedule or a manual trigger, not on every PR.
        run: pytest -v

  build:
    # Only worth building if the tests passed.
    needs: test
    runs-on: ubuntu-latest

    # The automatic token every run is issued starts READ-ONLY. Publishing a
    # package needs this one extra permission, granted here and nowhere else.
    # It still cannot touch anything but packages belonging to this repository,
    # and it expires when the job ends.
    permissions:
      contents: read
      packages: write

    # The image name, written once. github.repository is already "owner/repo",
    # exactly the shape ghcr.io expects. Image names must be lowercase — a repo
    # with a capital letter in its name would need lowercasing here.
    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        # Tagged with the commit SHA, not just `latest`, so a running container
        # can be traced back to exact source. `latest` alone is untraceable.
        #
        # Tagged with its FINAL registry name from the start, so the image the
        # smoke test below exercises is byte-for-byte the image that gets
        # pushed. A pipeline that rebuilds before publishing can ship an image
        # no test ever saw.
        run: docker build -t $IMAGE:${{ github.sha }} .

      - name: Smoke test the image
        # "It builds" is a weaker claim than "it runs". This catches a broken
        # ENTRYPOINT, a missing config.toml, or a file the non-root user cannot
        # read — none of which a successful build would reveal.
        # --mock: no API key, no network, no cost.
        run: |
          docker run --rm -v "$PWD/samples:/data:ro" \
            $IMAGE:${{ github.sha }} --file /data/ticket_02.txt --mock

      # Everything below runs ONLY on main, and this is where CI ends and CD
      # begins. A pull request must be able to build and test an image; it must
      # never be able to publish one under this account — including a PR from a
      # fork, opened by someone you have never met.
      #
      # Note the ORDER too: the push sits downstream of the smoke test, so a
      # broken image cannot reach the registry. Publish-then-verify would leave
      # a broken image sitting there for someone to pull.
      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/main'
        # No repository secret to create, store or rotate: GitHub issues this
        # token automatically for every run. That is the practical reason to
        # prefer ghcr.io over an external registry while learning.
        run: echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push
        if: github.ref == 'refs/heads/main'
        run: docker push $IMAGE:${{ github.sha }}

      - name: Verify the published image
        if: github.ref == 'refs/heads/main'
        # Removing the local tag forces the run below to pull from ghcr.io.
        # This is the only step that exercises the image AFTER it has left the
        # machine that built it, which is the one class of failure everything
        # above is blind to: an incomplete push, a wrong tag, or permissions
        # that let the pipeline write while nobody can read.
        run: |
          docker rmi $IMAGE:${{ github.sha }}
          docker run --rm $IMAGE:${{ github.sha }} --text "my internet is down" --mock
